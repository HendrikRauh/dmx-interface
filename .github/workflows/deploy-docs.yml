# cspell:words nojekyll
name: Deploy Doxygen to Pages

"on":
  push:
    branches: ["idf", "**", "!gh-pages"]
  delete: null

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'delete' &&
      github.event.ref != 'gh-pages'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Handle Branch Deletion
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          target-folder: branch/${{ github.event.ref }}
          clean: true
          clean-exclude: |
            !branch/${{ github.event.ref }}

  build_and_deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Nix and pre-warm flake devShell
        uses: ./.github/actions/install-nix

      - name: Build Doxygen Documentation from flake devShell
        run: |
          nix develop --command invoke docs
          touch docs/doxygen/html/.nojekyll
        shell: bash

      - name: Deploy Main Docs
        if: github.ref == 'refs/heads/idf'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/doxygen/html
          clean: false

      - name: Deploy Feature Branch Docs
        if: github.ref != 'refs/heads/idf'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/doxygen/html
          target-folder: branch/${{ github.ref_name }}
          clean: true
