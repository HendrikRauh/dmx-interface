# cspell:words nojekyll
name: gh-pages

"on":
  push:
    branches: ["**", "!gh-pages"]
  release:
    types: [published, edited, deleted]
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  # starlight-links-validator + the issue-table plugin read issues at build.
  issues: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Nix and pre-warm flake devShell
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/install-nix

      - name: Build web UI (include_bytes! needs web/dist)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          # src/net/http.rs include_bytes!s web/dist — gitignored, so build it here
          nix develop --command invoke web:build
        shell: bash

      - name: Build Documentation from flake devShell
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          # Astro base must match the deploy subfolder (see tasks.py:_site_base).
          DOCS_BASE: /dmx-interface/branch/${{ github.ref_name }}
          # Authenticated GitHub API access for the issue-table plugin
          # (roadmap/troubleshooting tables); unauthenticated rate limits
          # would otherwise hit shared CI runner IPs.
          GH_TOKEN: ${{ github.token }}
        run: |
          nix develop --command invoke docs
        shell: bash

      - name: Deploy Branch Docs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          # invoke docs builds the full site (incl. rustdoc at api/) here.
          folder: site/dist
          target-folder: branch/${{ github.ref_name }}
          clean: true

      - name: Generate Releases JSON (Isolated in Temp Folder)
        if: >
          github.event_name == 'release' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p temp_meta

          gh api repos/${{ github.repository }}/releases --paginate > github_releases.json

          cat << 'EOF' > parse.js
          const fs = require('fs');
          try {
            let data = JSON.parse(fs.readFileSync('github_releases.json', 'utf8'));

            if (Array.isArray(data) && data.length > 0 && Array.isArray(data[0])) {
              data = data.flat();
            } else if (!Array.isArray(data)) {
              data = [data].flat();
            }

            const output = data.map(release => ({
              tag: release.tag_name,
              assets: release.assets
                .filter(a => a.name.endsWith('.bin'))
                .map(a => ({ name: a.name, url: a.browser_download_url }))
            })).filter(r => r.assets.length > 0);

            fs.writeFileSync('temp_meta/releases.json', JSON.stringify(output, null, 2));
          } catch (e) {
            console.error("Error parsing releases:", e);
            fs.writeFileSync('temp_meta/releases.json', '[]');
          }
          EOF
          node parse.js
        shell: bash

      - name: Deploy ONLY releases.json to Subfolder
        if: >
          github.event_name == 'release' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'workflow_run'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: temp_meta
          target-folder: flasher/meta
          clean: false
